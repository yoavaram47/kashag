<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>מיקומים חיים</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  :root{
    --bg:#0b1220;
    --card:#121b2e;
    --line:#233150;
    --text:#eaf1ff;
    --muted:#8ea0c4;
    --accent:#35d0a0;
    --danger:#111;
    --ok:#22c55e;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Calibri,Arial,sans-serif;
  }

  header{
    padding:14px 14px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:600px;
    margin:auto;
  }

  h1{
    margin:0;
    font-size:20px;
  }

  .results{
    color:var(--accent);
    text-decoration:none;
    font-size:13px;
  }

  .wrap{
    max-width:600px;
    margin:auto;
    padding:0 12px 18px;
  }

  /* ---------------- User + location row ---------------- */

  .top-row{
    display:flex;
    gap:8px;
    align-items:stretch;
    margin-bottom:8px;
  }

  #userSelect{
    width:145px;
    min-width:0;
    padding:9px 10px;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:9px;
    font-size:14px;
    font-family:inherit;
  }

  .location-box{
    flex:1;
    min-width:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    padding:7px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }

  .location-title{
    color:var(--muted);
    font-size:12px;
  }

  #accuracyValue{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
  }

  #accuracyValue.good{
    color:var(--ok);
  }

  #accuracyValue.bad{
    color:#ff6b6b;
  }

  /* ---------------- Send button ---------------- */

  #sendBtn{
    width:100%;
    border:0;
    border-radius:9px;
    padding:10px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    background:var(--accent);
    color:#04231a;
    cursor:pointer;
    margin-bottom:8px;
  }

  #sendBtn:disabled{
    cursor:default;
  }

  /*
    שחור רק כשיש מיקום אבל הדיוק לא מספיק טוב
  */
  #sendBtn.accuracy-bad{
    background:#000;
    color:#fff;
    opacity:1;
  }

  #sendBtn:disabled:not(.accuracy-bad){
    opacity:.5;
  }

  /* ---------------- Status ---------------- */

  #status{
    min-height:0;
    margin-bottom:8px;
    padding:0 2px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
  }

  #status.err{
    color:#ff6b6b;
  }

  #status.ok{
    color:var(--ok);
    font-weight:700;
  }

  /* ---------------- Map ---------------- */

  .map-box{
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--card);
  }

  #map{
    width:100%;
    height:500px;
  }

  .leaflet-container{
    font-family:Calibri,Arial,sans-serif;
  }

  .my-marker{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#35d0a0;
    border:3px solid white;
    box-shadow:0 0 0 3px rgba(53,208,160,.28);
  }

  .other-marker{
    width:16px;
    height:16px;
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 1px 5px rgba(0,0,0,.5);
  }

  .leaflet-popup-content{
    direction:rtl;
    text-align:right;
    font-family:Calibri,Arial,sans-serif;
  }
</style>
</head>

<body>

<header>
  <h1>📍 מיקומים חיים</h1>
  <a class="results" href="results.html">🏁 תוצאות</a>
</header>

<div class="wrap">

  <div class="top-row">

    <select id="userSelect">
      <option value="">משתמש…</option>
    </select>

    <div class="location-box">
      <span class="location-title">מיקום</span>
      <span id="accuracyValue">מאתר…</span>
    </div>

  </div>

  <button id="sendBtn" disabled>
    שלח מרחק
  </button>

  <div id="status"></div>

  <div class="map-box">
    <div id="map"></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const WORKER_URL = "https://kashag.yoav-aram-47.workers.dev";

const ACCURACY_LIMIT = 20;
const REFRESH_INTERVAL = 5000;

const $ = id => document.getElementById(id);

const userSelect = $("userSelect");
const accuracyValue = $("accuracyValue");
const sendBtn = $("sendBtn");
const statusEl = $("status");

let myUser = localStorage.getItem("liveloc_user") || "";
let myPos = null;

let watchId = null;
let map = null;

let myMarker = null;
let myAccuracyCircle = null;

let otherMarkers = new Map();

let firstLocation = true;


/* =====================================================
   MAP
===================================================== */

function initMap(){

  map = L.map("map", {
    zoomControl:true
  }).setView([31.8,35.0],8);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
  ).addTo(map);
}


/* =====================================================
   ICONS
===================================================== */

function myIcon(){

  return L.divIcon({
    className:"",
    html:'<div class="my-marker"></div>',
    iconSize:[18,18],
    iconAnchor:[9,9],
    popupAnchor:[0,-10]
  });
}


function otherIcon(name){

  return L.divIcon({
    className:"",
    html:`
      <div
        class="other-marker"
        style="background:${colorFor(name)}"
      ></div>
    `,
    iconSize:[16,16],
    iconAnchor:[8,8],
    popupAnchor:[0,-9]
  });
}


/* =====================================================
   HELPERS
===================================================== */

function radians(x){
  return x * Math.PI / 180;
}


function distanceKm(a,b,c,d){

  const x =
    Math.sin(radians(c-a)/2) ** 2 +
    Math.cos(radians(a)) *
    Math.cos(radians(c)) *
    Math.sin(radians(d-b)/2) ** 2;

  return 2 * 6371 * Math.asin(Math.sqrt(x));
}


function formatDistance(km){

  if(km < 1){
    return Math.round(km * 1000) + " מ׳";
  }

  return km.toFixed(km < 10 ? 1 : 0) + " ק״מ";
}


function colorFor(name){

  let h = 0;

  for(const c of String(name)){
    h = (h * 31 + c.charCodeAt(0)) >>> 0;
  }

  return `hsl(${h % 360} 70% 60%)`;
}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function setStatus(text, cls=""){

  statusEl.textContent = text;
  statusEl.className = cls;
}


/* =====================================================
   ACCURACY
===================================================== */

function accuracyIsGood(){

  return (
    myPos &&
    Number.isFinite(myPos.accuracy) &&
    myPos.accuracy <= ACCURACY_LIMIT
  );
}


function updateAccuracyUI(){

  if(!myPos){

    accuracyValue.textContent = "מאתר…";
    accuracyValue.className = "";

    sendBtn.classList.remove("accuracy-bad");

    /*
      אין עדיין מדידה.
    */
    sendBtn.disabled = !myUser;

    return;
  }

  const accuracy = Math.round(myPos.accuracy);


  if(myPos.accuracy <= ACCURACY_LIMIT){

    accuracyValue.textContent = `±${accuracy} מ׳`;
    accuracyValue.className = "good";

    /*
      דיוק טוב:
      הכפתור חוזר לעיצוב הרגיל.
    */
    sendBtn.classList.remove("accuracy-bad");
    sendBtn.disabled = !myUser;

  } else {

    accuracyValue.textContent =
      `±${accuracy} מ׳`;

    accuracyValue.className = "bad";

    /*
      רק כאן הכפתור הופך לשחור.
    */
    sendBtn.classList.add("accuracy-bad");

    sendBtn.textContent =
      `נדרש דיוק ≤${ACCURACY_LIMIT} מ׳`;

    sendBtn.disabled = true;

    /*
      אין גישה למיקומים של אחרים
      כשהדיוק אינו מספיק.
    */
    clearOtherMarkers();

    setStatus(
      `הדיוק כרגע ±${accuracy} מ׳`,
      "err"
    );
  }

  if(myPos.accuracy <= ACCURACY_LIMIT){

    sendBtn.textContent = "שלח מרחק";
  }
}


/* =====================================================
   MY LOCATION
===================================================== */

function updateMyLocationOnMap(){

  if(!myPos) return;

  const latlng = [
    myPos.lat,
    myPos.lon
  ];


  /*
    מיקום עצמי מתעדכן תמיד.
  */
  if(!myMarker){

    myMarker = L.marker(
      latlng,
      {
        icon:myIcon(),
        zIndexOffset:1000
      }
    ).addTo(map);

    myMarker.bindPopup("");
  }

  else{

    myMarker.setLatLng(latlng);
  }


  myMarker.setPopupContent(`
    <strong>📍 ${escapeHtml(myUser)}</strong><br>
    דיוק: ±${Math.round(myPos.accuracy)} מ׳
  `);


  /*
    מעגל הדיוק מתעדכן כל הזמן.
  */
  if(!myAccuracyCircle){

    myAccuracyCircle = L.circle(
      latlng,
      {
        radius:myPos.accuracy,
        color:"#35d0a0",
        fillColor:"#35d0a0",
        fillOpacity:.10,
        weight:2
      }
    ).addTo(map);

  }else{

    myAccuracyCircle.setLatLng(latlng);
    myAccuracyCircle.setRadius(myPos.accuracy);
  }


  /*
    רק בפעם הראשונה מזיזים את המפה למשתמש.
    לאחר מכן המשתמש חופשי להזיז את המפה.
  */
  if(firstLocation){

    map.setView(
      latlng,
      17
    );

    firstLocation = false;
  }
}


/* =====================================================
   GEOLOCATION WATCH
===================================================== */

async function startLocationWatch(){

  stopLocationWatch();

  if(!navigator.geolocation){

    accuracyValue.textContent = "לא נתמך";
    setStatus(
      "הדפדפן לא תומך במיקום.",
      "err"
    );

    return;
  }


  myPos = null;
  firstLocation = true;

  updateAccuracyUI();


  setStatus(
    "ממתין למיקום מדויק…"
  );


  /*
    חשוב:
    enableHighAccuracy=true

    המיקום מתעדכן כל הזמן,
    אבל שום דבר לא נשלח לשרת מכאן.
  */
  watchId = navigator.geolocation.watchPosition(

    position => {

      myPos = {
        lat:position.coords.latitude,
        lon:position.coords.longitude,
        accuracy:position.coords.accuracy,
        timestamp:position.timestamp
      };


      /*
        תמיד מעדכן את המפה.
      */
      updateMyLocationOnMap();


      /*
        מעדכן את מד הדיוק והכפתור.
      */
      updateAccuracyUI();


      if(accuracyIsGood()){

        setStatus(
          `דיוק מספיק — ±${Math.round(myPos.accuracy)} מ׳`,
          "ok"
        );

        /*
          אפשר לראות משתמשים רק כשהדיוק מספיק.
        */
        refreshLocations();
      }

    },

    error => {

      sendBtn.classList.remove("accuracy-bad");

      sendBtn.disabled = true;

      if(error.code === error.PERMISSION_DENIED){

        accuracyValue.textContent = "אין הרשאה";
        setStatus(
          "יש לאשר הרשאת מיקום מדויקת.",
          "err"
        );

      }else{

        accuracyValue.textContent = "שגיאה";

        setStatus(
          "שגיאת מיקום: " + error.message,
          "err"
        );
      }
    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}


function stopLocationWatch(){

  if(watchId !== null){

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId = null;
  }
}


/* =====================================================
   USERS
===================================================== */

async function loadUsers(){

  try{

    const response =
      await fetch(WORKER_URL + "/api/users");

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );
    }

    const data =
      await response.json();

    userSelect.innerHTML =
      `<option value="">משתמש…</option>`;


    (data.users || []).forEach(user => {

      userSelect.add(
        new Option(user,user)
      );
    });


    if(myUser){

      userSelect.value = myUser;

      if(userSelect.value === myUser){

        startLocationWatch();
      }
    }

  }catch(e){

    setStatus(
      "שגיאה בטעינת המשתמשים.",
      "err"
    );
  }
}


/* =====================================================
   LATEST LOCATION ONLY
===================================================== */

/*
  הפונקציה הזאת מטפלת גם במצב שבו השרת מחזיר:

  {
    start: {...},
    yoav: {...}
  }

  וגם במצב שבו יש היסטוריה:

  {
    start: [
      {...},
      {...},
      {...}
    ]
  }

  וגם במצב שבו locations הוא מערך:

  [
    {user:"start", ...},
    {user:"start", ...},
    {user:"yoav", ...}
  ]

  בכל מקרה אנחנו משאירים רק את הרשומה העדכנית
  ביותר לכל משתמש.
*/

function getTimestamp(item){

  if(!item) return 0;

  const value =
    item.timestamp ??
    item.updatedAt ??
    item.updated_at ??
    item.time ??
    item.createdAt ??
    0;

  const t = Date.parse(value);

  if(Number.isFinite(t)){
    return t;
  }

  if(typeof value === "number"){
    return value;
  }

  return 0;
}


function chooseLatest(a,b){

  return getTimestamp(b) >= getTimestamp(a)
    ? b
    : a;
}


function normalizeLatestLocations(raw){

  const latest = {};


  /*
    Case 1:
    locations הוא מערך
  */
  if(Array.isArray(raw)){

    raw.forEach(item => {

      if(!item || !item.user){
        return;
      }

      const user = String(item.user);

      latest[user] =
        latest[user]
          ? chooseLatest(latest[user],item)
          : item;
    });

    return latest;
  }


  /*
    Case 2:
    locations הוא אובייקט
  */
  if(raw && typeof raw === "object"){

    for(const [key,value] of Object.entries(raw)){

      /*
        ערך הוא מערך היסטוריה
      */
      if(Array.isArray(value)){

        if(value.length === 0){
          continue;
        }

        let newest = value[0];

        for(let i=1;i<value.length;i++){

          newest =
            chooseLatest(newest,value[i]);
        }

        latest[key] = newest;
        continue;
      }


      /*
        ערך הוא מיקום יחיד
      */
      if(value && typeof value === "object"){

        /*
          אם בתוך הרשומה יש user,
          משתמשים בו. אחרת משתמשים בשם המפתח.
        */
        const user =
          value.user
            ? String(value.user)
            : String(key);

        latest[user] =
          latest[user]
            ? chooseLatest(latest[user],value)
            : value;
      }
    }
  }

  return latest;
}


/* =====================================================
   OTHER MARKERS
===================================================== */

function clearOtherMarkers(){

  for(const marker of otherMarkers.values()){

    map.removeLayer(marker);
  }

  otherMarkers.clear();
}


function renderLocations(rawLocations){

  /*
    לא מציגים מיקומי אחרים בלי דיוק מספיק.
  */
  if(!accuracyIsGood()){

    clearOtherMarkers();

    return;
  }


  const locations =
    normalizeLatestLocations(rawLocations);


  const usersOnMap =
    new Set();


  for(const [name,p] of Object.entries(locations)){

    /*
      אנחנו לא מציגים את עצמנו ברשימת האחרים.
    */
    if(name === myUser){
      continue;
    }


    if(!p){
      continue;
    }


    const lat = Number(
      p.lat ?? p.latitude
    );

    const lon = Number(
      p.lon ?? p.lng ?? p.longitude
    );


    if(
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ){
      continue;
    }


    usersOnMap.add(name);


    const distance =
      distanceKm(
        myPos.lat,
        myPos.lon,
        lat,
        lon
      );


    const timestamp =
      p.timestamp ??
      p.updatedAt ??
      "";


    const popup = `
      <strong>👤 ${escapeHtml(name)}</strong><br>
      מרחק: ${formatDistance(distance)}<br>
      ${
        timestamp
          ? "עדכון: " + escapeHtml(timestamp)
          : ""
      }
    `;


    let marker =
      otherMarkers.get(name);


    if(!marker){

      marker =
        L.marker(
          [lat,lon],
          {
            icon:otherIcon(name)
          }
        ).addTo(map);

      otherMarkers.set(
        name,
        marker
      );

    }else{

      marker.setLatLng(
        [lat,lon]
      );
    }


    marker.bindPopup(popup);
  }


  /*
    מוחקים מיקומים של משתמשים
    שכבר אינם קיימים בתשובת השרת.
  */
  for(
    const [name,marker]
    of otherMarkers.entries()
  ){

    if(!usersOnMap.has(name)){

      map.removeLayer(marker);
      otherMarkers.delete(name);
    }
  }
}


/* =====================================================
   REFRESH OTHER LOCATIONS
===================================================== */

async function refreshLocations(){

  if(!accuracyIsGood()){

    clearOtherMarkers();

    return;
  }


  try{

    const response =
      await fetch(
        WORKER_URL + "/api/locations",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){
      return;
    }


    const data =
      await response.json();


    renderLocations(
      data.locations || data
    );

  }catch(e){

    console.error(
      "refreshLocations:",
      e
    );
  }
}


/* =====================================================
   SEND
===================================================== */

sendBtn.addEventListener(
  "click",
  async () => {

    /*
      בדיקת אבטחה נוספת:
      גם אם somehow הכפתור הופעל,
      אין לשלוח נתון עם דיוק גרוע.
    */
    if(!myUser){
      return;
    }


    if(!myPos){

      setStatus(
        "עדיין אין מיקום.",
        "err"
      );

      return;
    }


    if(myPos.accuracy > ACCURACY_LIMIT){

      updateAccuracyUI();

      return;
    }


    sendBtn.disabled = true;
    sendBtn.textContent = "שולח…";


    try{

      /*
        המיקום הנוכחי בלבד נשלח כאן.
        watchPosition עצמו לא שולח שום דבר.
      */
      const response =
        await fetch(
          WORKER_URL + "/api/location",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              user:myUser,
              lat:myPos.lat,
              lon:myPos.lon,
              accuracy:myPos.accuracy
            })
          }
        );


      const result =
        await response.json();


      if(
        !response.ok ||
        result.error
      ){

        throw new Error(
          result.error ||
          ("HTTP " + response.status)
        );
      }


      /*
        אם השרת זיהה נקודת ביקורת.
      */
      if(result.near){

        setStatus(
          `✅ ${result.near.point} — ${result.near.distance} מ׳`,
          "ok"
        );

      }else{

        setStatus(
          `✅ המיקום נשלח — דיוק ±${Math.round(myPos.accuracy)} מ׳`,
          "ok"
        );
      }


      /*
        אחרי השליחה מרעננים את המפה,
        אבל לא משנים את myPos.
      */
      await refreshLocations();


    }catch(e){

      setStatus(
        "שגיאה בשליחה: " + e.message,
        "err"
      );

    }finally{

      updateAccuracyUI();
    }
  }
);


/* =====================================================
   USER CHANGE
===================================================== */

userSelect.addEventListener(
  "change",
  () => {

    myUser =
      userSelect.value;

    localStorage.setItem(
      "liveloc_user",
      myUser
    );


    clearOtherMarkers();


    if(!myUser){

      stopLocationWatch();

      myPos = null;

      accuracyValue.textContent =
        "בחר משתמש";

      accuracyValue.className = "";

      sendBtn.disabled = true;
      sendBtn.classList.remove(
        "accuracy-bad"
      );

      sendBtn.textContent =
        "שלח מרחק";

      setStatus("");

      return;
    }


    /*
      מתחילים לקבל מיקום ברציפות.
      שום מיקום עדיין לא נשלח.
    */
    startLocationWatch();
  }
);


/* =====================================================
   LIVE REFRESH
===================================================== */

setInterval(
  () => {

    /*
      הרענון הוא של המשתמשים האחרים בלבד.

    if(accuracyIsGood()){

  },
