<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מיקומים חיים</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{ --bg:#0b1220; --card:#121b2e; --line:#233150; --text:#eaf1ff; --muted:#8ea0c4; --accent:#35d0a0; --ok:#22c55e; --danger:#ff6b6b; }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:Calibri,Arial,sans-serif; }
  header{ padding:14px 14px 8px; display:flex; align-items:center; justify-content:space-between; max-width:600px; margin:auto; }
  h1{ margin:0; font-size:20px; }
  .results{ color:var(--accent); text-decoration:none; font-size:13px; }
  .wrap{ max-width:600px; margin:auto; padding:0 12px 18px; }
  .wrap.with-actionbar{ padding-bottom:132px; }

  /* user picker */
  .user-row{ display:flex; gap:8px; margin-bottom:8px; }
  #userInput{ flex:1; min-width:0; padding:9px 10px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; }
  #confirmUserBtn{ flex:0 0 auto; padding:9px 14px; border:0; border-radius:9px; background:var(--accent); color:#04231a; font-weight:700; font-size:14px; font-family:inherit; cursor:pointer; }
  #confirmUserBtn:disabled{ opacity:.5; cursor:default; }
  #userNote{ font-size:12px; color:var(--muted); margin:-2px 0 8px; min-height:15px; }
  #userNote.new{ color:var(--accent); }
  .active-user{ font-size:13px; color:var(--muted); margin-bottom:8px; }
  .active-user b{ color:var(--text); }
  .active-user button{ margin-right:8px; background:none; border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:2px 8px; font-size:12px; font-family:inherit; cursor:pointer; }

  .reg-row{ display:flex; gap:8px; margin-bottom:8px; }
  #plugahSelect{ flex:0 0 90px; padding:9px 10px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; }
  #tzevetInput{ flex:1; min-width:0; padding:9px 10px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; }

  /* single accuracy readout, shown for both admin and runner */
  .location-box{ background:var(--card); border:1px solid var(--line); border-radius:9px; padding:7px 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .location-title{ color:var(--muted); font-size:12px; }
  #accuracyValue{ font-size:13px; font-weight:700; white-space:nowrap; }
  #accuracyValue.good{ color:var(--ok); }
  #accuracyValue.bad{ color:var(--danger); }

  #status{ min-height:0; margin-bottom:8px; padding:0 2px; color:var(--muted); font-size:12px; text-align:center; }
  #status.err{ color:var(--danger); }
  #status.ok{ color:var(--ok); font-weight:700; }

  /* admin panel (map lives here — admin only) */
  .admin-box{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .admin-box h3{ margin:0 0 10px; font-size:15px; }
  .admin-row{ display:flex; gap:8px; margin-bottom:10px; }
  .admin-row button{ flex:1; padding:12px; border-radius:9px; border:0; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }
  .cp-start{ background:var(--accent); color:#04231a; }
  .cp-middle{ background:#3b82f6; color:#fff; }
  .signal-row{ display:flex; gap:8px; margin-bottom:8px; }
  .signal-row input{ flex:0 0 90px; padding:10px; border-radius:9px; background:var(--bg); color:var(--text); border:1px solid var(--line); font-size:14px; font-family:inherit; }
  .signal-row button{ flex:1; padding:10px; border-radius:9px; border:0; background:#f59e0b; color:#221600; font-weight:700; font-family:inherit; font-size:14px; cursor:pointer; }
  .cp-status{ font-size:12px; color:var(--muted); margin-top:8px; }
  #adminCountdown{ font-size:14px; font-weight:700; color:var(--accent); min-height:18px; margin-top:6px; }
  .source-row{ display:flex; gap:8px; margin-bottom:8px; font-size:13px; }
  .source-row label{ flex:1; display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:8px 10px; cursor:pointer; }
  .source-row input{ accent-color:var(--accent); }

  .map-box{ overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  #map{ width:100%; height:380px; }
  .leaflet-container{ font-family:Calibri,Arial,sans-serif; }
  .my-marker{ width:18px; height:18px; border-radius:50%; background:var(--accent); border:3px solid white; box-shadow:0 0 0 3px rgba(53,208,160,.28); }
  .cp-marker{ width:16px; height:16px; border-radius:50%; border:3px solid white; box-shadow:0 1px 5px rgba(0,0,0,.5); }
  .leaflet-popup-content{ direction:rtl; text-align:right; font-family:Calibri,Arial,sans-serif; }

  /* fixed action bar (runners only) */
  #actionBar{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--card); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); max-width:600px; margin:0 auto; box-shadow:0 -4px 16px rgba(0,0,0,.35); }
  #runInfo{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  #runTimer{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  #runDistance{ font-size:14px; color:var(--muted); }
  #actionButtons{ display:flex; gap:8px; }
  #sendBtn{ flex:1; border:0; border-radius:9px; padding:12px; font-family:inherit; font-size:14px; font-weight:700; background:var(--accent); color:#04231a; cursor:pointer; }
  #sendBtn:disabled{ opacity:.5; cursor:default; }
  #stopBtn{ display:none; flex:0 0 auto; border:1px solid var(--danger); background:none; color:var(--danger); border-radius:9px; padding:12px 14px; font-family:inherit; font-size:13px; cursor:pointer; }

  /* fullscreen countdown — runners only, so nothing (no map) sits behind it */
  #countdownOverlay{ display:none; position:fixed; inset:0; z-index:99999; background:rgba(5,10,20,.96); flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; }
  #countdownOverlay.show{ display:flex; }
  #countdownNumber{ font-size:110px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1; }
  #countdownLabel{ font-size:18px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>

<header>
  <h1>📍 מיקומים חיים</h1>
  <a class="results" href="results.html">🏁 תוצאות</a>
</header>

<div class="wrap" id="wrap">

  <div id="pickerBlock">
    <div class="user-row">
      <input id="userInput" list="usersList" placeholder="הקלידו שם משתמש…" autocomplete="off">
      <datalist id="usersList"></datalist>
      <button id="confirmUserBtn" disabled>בחר</button>
    </div>
    <div id="userNote"></div>
    <div id="registerFields" style="display:none" class="reg-row">
      <select id="plugahSelect">
        <option value="">פלוגה</option>
        <option value="א">א</option><option value="ב">ב</option><option value="ג">ג</option>
        <option value="ד">ד</option><option value="ה">ה</option><option value="ו">ו</option><option value="ז">ז</option>
      </select>
      <input id="tzevetInput" type="number" min="1" max="30" placeholder="צוות (1-30)">
    </div>
  </div>

  <div id="activeUserBlock" class="active-user" style="display:none">
    מחובר בתור <b id="activeUserName"></b>
    <button id="switchUserBtn">החלף</button>
  </div>

  <div id="geoBlock" style="display:none">
    <div class="location-box">
      <span class="location-title">מיקום</span>
      <span id="accuracyValue">מאתר…</span>
    </div>
    <div id="status"></div>
  </div>

  <!-- ADMIN PANEL (map lives here — admin only) -->
  <div id="adminBlock" style="display:none">
    <div class="admin-box">
      <h3 id="adminTitle">ניהול נקודות ציון</h3>
      <div class="admin-row">
        <button id="setStartBtn" class="cp-start">📍 קבע כאן Start</button>
        <button id="setMiddleBtn" class="cp-middle">📍 קבע כאן Middle</button>
      </div>

      <div id="sourceBlock" style="display:none">
        <div class="source-row">
          <label><input type="radio" name="cpSource" value="global"> נקודות גדודיות (ברירת מחדל)</label>
          <label><input type="radio" name="cpSource" value="own"> נקודות הפלוגה שלי</label>
        </div>
      </div>

      <div class="cp-status" id="cpStatus"></div>
    </div>

    <div class="admin-box">
      <h3>🚦 הזנקה</h3>
      <div class="signal-row">
        <input id="signalSeconds" type="number" min="1" max="600" value="20">
        <button id="signalBtn">הזנק!</button>
      </div>
      <div class="cp-status">כל רץ אידיאלי (עדיין לא התחיל) שנמצא בטווח 20 מ׳ מ-Start כשהספירה מגיעה לאפס, יתחיל ריצה אוטומטית. האמצע והסיום נשארים תמיד ביד הרץ.</div>
      <div id="adminCountdown"></div>
    </div>

    <div class="map-box"><div id="map"></div></div>
  </div>

</div>

<div id="actionBar" style="display:none">
  <div id="runInfo">
    <div id="runTimer">00:00</div>
    <div id="runDistance"></div>
  </div>
  <div id="actionButtons">
    <button id="sendBtn" disabled>שלח מרחק</button>
    <button id="stopBtn">עצור ריצה</button>
  </div>
</div>

<div id="countdownOverlay">
  <div id="countdownNumber">20</div>
  <div id="countdownLabel">הזנקה — התכוננו!</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WORKER_URL = "https://kashag.yoav-aram-47.workers.dev";
const ACCURACY_LIMIT = 20;
const REFRESH_INTERVAL = 5000;

const $ = id => document.getElementById(id);

const wrapEl = $("wrap");
const userInput = $("userInput"), usersListEl = $("usersList"), confirmUserBtn = $("confirmUserBtn"), userNote = $("userNote");
const pickerBlock = $("pickerBlock"), activeUserBlock = $("activeUserBlock"), activeUserName = $("activeUserName"), switchUserBtn = $("switchUserBtn");
const registerFields = $("registerFields"), plugahSelect = $("plugahSelect"), tzevetInput = $("tzevetInput");
const geoBlock = $("geoBlock"), accuracyValue = $("accuracyValue"), statusEl = $("status");
const adminBlock = $("adminBlock"), adminTitle = $("adminTitle"), setStartBtn = $("setStartBtn"), setMiddleBtn = $("setMiddleBtn"), cpStatus = $("cpStatus");
const sourceBlock = $("sourceBlock"), adminCountdownEl = $("adminCountdown");
const signalSeconds = $("signalSeconds"), signalBtn = $("signalBtn");
const actionBar = $("actionBar"), sendBtn = $("sendBtn"), stopBtn = $("stopBtn"), runTimerEl = $("runTimer"), runDistanceEl = $("runDistance");
const countdownOverlay = $("countdownOverlay"), countdownNumber = $("countdownNumber"), countdownLabel = $("countdownLabel");

let knownAdmins = [], knownPeople = [], labelToPerson = {};
let myUser = null, myAdminScope = null, myPlugah = null;

let myPos = null, watchId = null, map = null, mapReady = false, myMarker = null, myAccuracyCircle = null, firstLocation = true;
let cpMarkers = {};
let checkpointPositions = {};
let runTarget = null, runState = "idle", runStartMs = null;
let stateTimer = null, clockTimer = null, adminCountdownTimer = null;
let lastHandledSignalIssuedAt = null, countdownTimer = null;

/* ===================== small helpers ===================== */

const radians = x => x * Math.PI / 180;
function distanceKm(a,b,c,d){
  const x = Math.sin(radians(c-a)/2)**2 + Math.cos(radians(a))*Math.cos(radians(c))*Math.sin(radians(d-b)/2)**2;
  return 2*6371*Math.asin(Math.sqrt(x));
}
function escapeHtml(t){ return String(t).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
function setStatus(t, cls=""){ statusEl.textContent = t; statusEl.className = cls; }
function safeUsername(u){ return String(u||"").replace(/[^a-zA-Z0-9_\u05D0-\u05EA \-]/g,"").replace(/\s+/g," ").trim().slice(0,60); }
function isAdminNameLike(u){ return u === "admin_גדוד" || /^admin_[\u05D0-\u05D6]$/.test(u); }
function formatElapsed(ms){ const total = Math.max(0, Math.floor(ms/1000)); return String(Math.floor(total/60)).padStart(2,"0") + ":" + String(total%60).padStart(2,"0"); }

/* ===================== map (admin only) ===================== */

function initMap(){
  map = L.map("map",{zoomControl:true}).setView([31.8,35.0],8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  mapReady = true;
}
function myIcon(){ return L.divIcon({className:"",html:'<div class="my-marker"></div>',iconSize:[18,18],iconAnchor:[9,9]}); }
function cpIcon(color){ return L.divIcon({className:"",html:`<div class="cp-marker" style="background:${color}"></div>`,iconSize:[16,16],iconAnchor:[8,8]}); }

function updateMyLocationOnMap(){
  if(!myPos || !mapReady) return;
  const latlng=[myPos.lat,myPos.lon];
  if(!myMarker){ myMarker=L.marker(latlng,{icon:myIcon(),zIndexOffset:1000}).addTo(map); myMarker.bindPopup(""); }
  else myMarker.setLatLng(latlng);
  myMarker.setPopupContent(`<strong>📍 ${escapeHtml(myUser)}</strong><br>דיוק: ±${Math.round(myPos.accuracy)} מ׳`);
  if(!myAccuracyCircle) myAccuracyCircle=L.circle(latlng,{radius:myPos.accuracy,color:"#35d0a0",fillColor:"#35d0a0",fillOpacity:.10,weight:2}).addTo(map);
  else { myAccuracyCircle.setLatLng(latlng); myAccuracyCircle.setRadius(myPos.accuracy); }
  if(firstLocation){ map.setView(latlng,17); firstLocation=false; }
}

function renderCheckpointsOnMap(){
  if(!mapReady) return;
  for(const point of ["start","middle"]){
    const pos = checkpointPositions[point];
    if(!pos){
      if(cpMarkers[point]){ map.removeLayer(cpMarkers[point]); delete cpMarkers[point]; }
      continue;
    }
    const color = point==="start" ? "#35d0a0" : "#3b82f6";
    if(!cpMarkers[point]) cpMarkers[point]=L.marker([pos.lat,pos.lon],{icon:cpIcon(color)}).addTo(map);
    else cpMarkers[point].setLatLng([pos.lat,pos.lon]);
    cpMarkers[point].bindPopup(`<strong>${point==="start"?"🏁 Start":"🔵 Middle"}</strong>`);
  }
}

/* ===================== user picker (supports duplicate names) ===================== */

function personLabel(p){ return `${p.name} (פלוגה ${p.plugah}, צוות ${p.tzevet})`; }

function buildLabelIndex(){
  labelToPerson = {};
  knownAdmins.forEach(a => labelToPerson[a] = { id:a, name:a, isAdmin:true });
  knownPeople.forEach(p => labelToPerson[personLabel(p)] = { ...p, isAdmin:false });
}

function renderUserDatalist(){
  usersListEl.innerHTML = "";
  Object.keys(labelToPerson).sort().forEach(label => usersListEl.appendChild(new Option(label,label)));
}

function updateUserNote(){
  const typed = userInput.value.trim();
  if(!typed){ userNote.textContent=""; userNote.className=""; registerFields.style.display="none"; confirmUserBtn.disabled=true; confirmUserBtn.textContent="בחר"; return; }

  if(labelToPerson[typed]){
    userNote.textContent=""; userNote.className=""; registerFields.style.display="none";
    confirmUserBtn.disabled=false; confirmUserBtn.textContent="בחר";
    return;
  }

  if(isAdminNameLike(safeUsername(typed))){
    userNote.textContent = "שם זה שמור למנהל ולא ניתן להירשם אליו.";
    userNote.className = "new"; registerFields.style.display="none"; confirmUserBtn.disabled=true;
    return;
  }

  userNote.textContent = `"${typed}" לא נמצא — מלאו פלוגה וצוות ולחצו הרשם (גם אם השם כבר תפוס אצל מישהו אחר, זה בסדר)`;
  userNote.className = "new"; registerFields.style.display="flex"; confirmUserBtn.textContent="הרשם";
  confirmUserBtn.disabled = !(plugahSelect.value && isValidTzevetValue());
}
function isValidTzevetValue(){ const n=Number(tzevetInput.value); return Number.isInteger(n)&&n>=1&&n<=30; }
plugahSelect.addEventListener("change", updateUserNote);
tzevetInput.addEventListener("input", updateUserNote);
userInput.addEventListener("input", updateUserNote);
userInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); confirmUser(); } });
confirmUserBtn.addEventListener("click", confirmUser);
switchUserBtn.addEventListener("click", showPicker);

async function confirmUser(){
  const typed = userInput.value.trim();
  if(!typed) return;
  confirmUserBtn.disabled = true;

  const existing = labelToPerson[typed];
  if(existing){ selectPerson(existing); return; }

  const name = safeUsername(typed);
  const plugah = plugahSelect.value, tzevet = tzevetInput.value;
  if(!name || !plugah || !isValidTzevetValue()){ setStatus("יש למלא שם, פלוגה (א-ז) וצוות (1-30).","err"); confirmUserBtn.disabled=false; return; }

  try{
    const res = await fetch(WORKER_URL+"/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:name,plugah,tzevet})});
    const result = await res.json();
    if(!res.ok || result.error) throw new Error(result.error || ("HTTP "+res.status));
    const person = { id:result.id, name:result.name, plugah:result.plugah, tzevet:result.tzevet, isAdmin:false };
    knownPeople.push(person);
    buildLabelIndex(); renderUserDatalist();
    registerFields.style.display="none"; plugahSelect.value=""; tzevetInput.value="";
    selectPerson(person);
  }catch(e){ setStatus("שגיאה ברישום המשתמש: "+e.message,"err"); confirmUserBtn.disabled=false; }
}

function selectPerson(person){
  myUser = person.id;
  localStorage.setItem("liveloc_user_id", person.id);

  myAdminScope = person.isAdmin
    ? (person.id==="admin_גדוד" ? {scope:"battalion"} : {scope:"platoon", plugah:person.id.split("_")[1]})
    : null;
  myPlugah = person.isAdmin ? (myAdminScope.plugah || null) : person.plugah;

  runTarget=null; runState = myAdminScope ? "admin" : "idle"; runStartMs=null; stopClock();
  lastHandledSignalIssuedAt = null; hideCountdown();
  if(adminCountdownTimer){ clearInterval(adminCountdownTimer); adminCountdownTimer=null; }
  adminCountdownEl.textContent = "";

  pickerBlock.style.display="none";
  activeUserBlock.style.display="block";
  activeUserName.textContent = person.isAdmin ? person.name : personLabel(person);

  geoBlock.style.display="block";
  accuracyValue.textContent="מאתר…"; accuracyValue.className="";
  setStatus("");

  if(stateTimer){ clearInterval(stateTimer); stateTimer=null; }

  if(myAdminScope){
    adminBlock.style.display="block";
    wrapEl.classList.remove("with-actionbar");
    actionBar.style.display="none";
    adminTitle.textContent = myAdminScope.scope==="battalion" ? "ניהול נקודות ציון — כל הגדוד" : `ניהול נקודות ציון — פלוגה ${myAdminScope.plugah}`;
    sourceBlock.style.display = myAdminScope.scope==="platoon" ? "block" : "none";
    startLocationWatch();
    if(myAdminScope.scope==="platoon") loadCheckpointSource();
    setTimeout(()=>{ if(map) map.invalidateSize(); }, 60);
  }else{
    adminBlock.style.display="none";
    wrapEl.classList.add("with-actionbar");
    actionBar.style.display="block";
    startLocationWatch();
    refreshMyState();
    refreshCheckpoints();
    stateTimer = setInterval(()=>{ refreshMyState(); refreshCheckpoints(); pollSignal(); }, REFRESH_INTERVAL);
  }
}

function showPicker(){
  stopLocationWatch();
  if(stateTimer){ clearInterval(stateTimer); stateTimer=null; }
  if(adminCountdownTimer){ clearInterval(adminCountdownTimer); adminCountdownTimer=null; }
  hideCountdown();

  myUser=null; myAdminScope=null; myPlugah=null;
  localStorage.removeItem("liveloc_user_id");
  myPos=null; firstLocation=true;
  runTarget=null; runState="idle"; runStartMs=null; stopClock();

  sendBtn.disabled=true; sendBtn.textContent="שלח מרחק"; stopBtn.style.display="none";
  setStatus("");

  activeUserBlock.style.display="none";
  geoBlock.style.display="none";
  adminBlock.style.display="none";
  wrapEl.classList.remove("with-actionbar");
  actionBar.style.display="none";
  pickerBlock.style.display="block";
  userInput.value=""; updateUserNote(); userInput.focus();
}

async function loadUsers(){
  try{
    const res = await fetch(WORKER_URL+"/api/users");
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    knownAdmins = data.admins || [];
    knownPeople = data.people || [];
    buildLabelIndex(); renderUserDatalist();

    const savedId = localStorage.getItem("liveloc_user_id");
    if(savedId){
      const found = knownAdmins.includes(savedId)
        ? { id:savedId, name:savedId, isAdmin:true }
        : knownPeople.find(p => p.id===savedId);
      if(found){ selectPerson(found); return; }
    }
    showPicker();
  }catch(e){ setStatus("שגיאה בטעינת המשתמשים.","err"); showPicker(); }
}

/* ===================== geolocation (shared by admin + runner) ===================== */

function accuracyIsGood(){ return myPos && Number.isFinite(myPos.accuracy) && myPos.accuracy<=ACCURACY_LIMIT; }

function updateAccuracyUI(){
  if(!myPos){ accuracyValue.textContent="מאתר…"; accuracyValue.className=""; applyRunGating(); return; }
  const acc = Math.round(myPos.accuracy);
  accuracyValue.textContent = `±${acc} מ׳`;
  accuracyValue.className = myPos.accuracy<=ACCURACY_LIMIT ? "good" : "bad";
  applyRunGating();
}

function startLocationWatch(){
  stopLocationWatch();
  if(!navigator.geolocation){ accuracyValue.textContent="לא נתמך"; setStatus("הדפדפן לא תומך במיקום.","err"); return; }
  myPos=null; firstLocation=true; updateAccuracyUI();
  watchId = navigator.geolocation.watchPosition(pos=>{
    myPos = {lat:pos.coords.latitude, lon:pos.coords.longitude, accuracy:pos.coords.accuracy};
    updateMyLocationOnMap();
    updateAccuracyUI();
  }, err=>{
    if(err.code===err.PERMISSION_DENIED) setStatus("יש לאשר הרשאת מיקום מדויקת.","err");
    else setStatus("שגיאת מיקום: "+err.message,"err");
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}
function stopLocationWatch(){ if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }

/* ===================== checkpoints (runner) ===================== */

async function refreshCheckpoints(){
  try{
    const res = await fetch(WORKER_URL+"/api/checkpoints?plugah="+encodeURIComponent(myPlugah||""), {cache:"no-store"});
    const data = await res.json();
    checkpointPositions = { start: data.start || null, middle: data.middle || null };
    applyRunGating();
  }catch(e){}
}

/* ===================== run state / timer (runner) ===================== */

const RUN_BUTTON_LABEL = { idle:"התחל ריצה", started:"הגעתי לאמצע!", middle:"סיים ריצה" };

async function refreshMyState(){
  if(!myUser || myAdminScope) return;
  try{
    const res = await fetch(WORKER_URL+"/api/mystate?user="+encodeURIComponent(myUser));
    const data = await res.json();
    if(data.target){ runTarget=data.target; runState=data.state; applyRunTimer(data.current); applyRunGating(); }
  }catch(e){}
}
function applyRunTimer(current){
  if(current && current.start){ runStartMs = Date.parse(current.start); startClock(); }
  else{ runStartMs=null; stopClock(); }
}
function startClock(){ if(clockTimer) return; clockTimer=setInterval(()=>{ runTimerEl.textContent = runStartMs==null?"00:00":formatElapsed(Date.now()-runStartMs); },1000); }
function stopClock(){ if(clockTimer){ clearInterval(clockTimer); clockTimer=null; } runTimerEl.textContent="00:00"; }

function applyRunGating(){
  if(!myUser || myAdminScope){ runTimerEl.textContent=""; runDistanceEl.textContent=""; return; }
  runTimerEl.textContent = runStartMs==null ? "00:00" : formatElapsed(Date.now()-runStartMs);
  stopBtn.style.display = (runState==="started"||runState==="middle") ? "block" : "none";

  if(!myPos || !accuracyIsGood()){ sendBtn.disabled=true; return; }
  if(!runTarget){ sendBtn.disabled=true; sendBtn.textContent="טוען מצב…"; runDistanceEl.textContent=""; return; }

  sendBtn.textContent = RUN_BUTTON_LABEL[runState] || RUN_BUTTON_LABEL.idle;
  const targetLabel = runTarget==="start" ? "Start" : "Middle";
  const targetPos = checkpointPositions[runTarget];
  if(!targetPos){ sendBtn.disabled=true; runDistanceEl.textContent=`ממתין למיקום של ${targetLabel}…`; return; }

  const distM = Math.round(distanceKm(myPos.lat,myPos.lon,targetPos.lat,targetPos.lon)*1000);
  runDistanceEl.textContent = `מרחק מ-${targetLabel}: ${distM} מ׳`;
  sendBtn.disabled = distM > ACCURACY_LIMIT;
}

/* ===================== send / stop (runner) ===================== */

async function sendCheckIn(){
  if(!myUser || !myPos) return;
  sendBtn.disabled = true;
  sendBtn.textContent = "שולח…";
  try{
    const res = await fetch(WORKER_URL+"/api/location",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({user:myUser, lat:myPos.lat, lon:myPos.lon})});
    const result = await res.json();
    if(!res.ok || result.error) throw new Error(result.error || ("HTTP "+res.status));

    if(result.near) setStatus(`✅ נרשם: ${result.near.point} — ${result.near.timestamp}`,"ok");
    else setStatus("לא היית בטווח — נסו שוב כשתתקרבו.","err");

    if(result.target){ runTarget=result.target; runState=result.state; applyRunTimer(result.current); }
    await refreshCheckpoints();
    applyRunGating();
    return result;
  }catch(e){ setStatus("שגיאה בשליחה: "+e.message,"err"); }
  finally{ updateAccuracyUI(); }
}

sendBtn.addEventListener("click", async ()=>{
  if(myPos && myPos.accuracy>ACCURACY_LIMIT){ updateAccuracyUI(); return; }
  await sendCheckIn();
});

stopBtn.addEventListener("click", async ()=>{
  if(!confirm("לעצור את הריצה הנוכחית? הנתונים של הריצה הזו יימחקו ולא ייספרו.")) return;
  stopBtn.disabled = true;
  try{
    const res = await fetch(WORKER_URL+"/api/stop-run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:myUser})});
    const result = await res.json();
    if(!res.ok || result.error) throw new Error(result.error || ("HTTP "+res.status));
    setStatus("הריצה נעצרה.","ok");
    runStartMs=null; stopClock();
    await refreshMyState();
  }catch(e){ setStatus("שגיאה בעצירת הריצה: "+e.message,"err"); }
  finally{ stopBtn.disabled=false; }
});

/* ===================== admin: checkpoints + source + signal ===================== */

function sendAdminCheckpoint(point){
  if(!myPos){ cpStatus.textContent="ממתין למיקום שלך…"; return; }
  cpStatus.textContent = "שולח…";
  fetch(WORKER_URL+"/api/set-checkpoint",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user:myUser, point, lat:myPos.lat, lon:myPos.lon})})
    .then(r=>r.json())
    .then(result=>{
      if(result.error) throw new Error(result.error);
      cpStatus.textContent = `${point==="start"?"Start":"Middle"} עודכן בהצלחה (±${Math.round(myPos.accuracy)} מ׳).`;
      checkpointPositions[point] = { lat:myPos.lat, lon:myPos.lon };
      renderCheckpointsOnMap();
    })
    .catch(e=> cpStatus.textContent = "שגיאה: "+e.message);
}
setStartBtn.addEventListener("click", ()=>sendAdminCheckpoint("start"));
setMiddleBtn.addEventListener("click", ()=>sendAdminCheckpoint("middle"));

async function loadCheckpointSource(){
  try{
    const res = await fetch(WORKER_URL+"/api/checkpoints?plugah="+encodeURIComponent(myPlugah), {cache:"no-store"});
    const data = await res.json();
    checkpointPositions = { start:data.start||null, middle:data.middle||null };
    renderCheckpointsOnMap();
    const radios = document.querySelectorAll('input[name="cpSource"]');
    radios.forEach(r => r.checked = (r.value === (data.source || "global")));
  }catch(e){}
}
document.querySelectorAll('input[name="cpSource"]').forEach(radio=>{
  radio.addEventListener("change", async (e)=>{
    if(!e.target.checked) return;
    cpStatus.textContent = "מעדכן...";
    try{
      const res = await fetch(WORKER_URL+"/api/set-checkpoint-source",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({user:myUser, source:e.target.value})});
      const result = await res.json();
      if(!res.ok || result.error) throw new Error(result.error || ("HTTP "+res.status));
      cpStatus.textContent = e.target.value==="own" ? "הפלוגה שלך תשתמש בנקודות שלה." : "הפלוגה שלך תשתמש בנקודות הגדודיות.";
      await loadCheckpointSource();
    }catch(e){ cpStatus.textContent = "שגיאה: "+e.message; }
  });
});

signalBtn.addEventListener("click", async ()=>{
  const seconds = Number(signalSeconds.value);
  if(!Number.isInteger(seconds) || seconds<1 || seconds>600){ cpStatus.textContent="בחרו מספר שניות בין 1 ל-600."; return; }
  signalBtn.disabled = true;
  try{
    const res = await fetch(WORKER_URL+"/api/start-signal",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({user:myUser, seconds})});
    const result = await res.json();
    if(!res.ok || result.error) throw new Error(result.error || ("HTTP "+res.status));
    runAdminCountdown(result.issuedAt + result.seconds*1000);
  }catch(e){ cpStatus.textContent = "שגיאה: "+e.message; }
  finally{ signalBtn.disabled=false; }
});

// Small, non-blocking countdown shown to the admin (the map stays fully visible).
function runAdminCountdown(deadline){
  if(adminCountdownTimer) clearInterval(adminCountdownTimer);
  adminCountdownTimer = setInterval(()=>{
    const remaining = Math.ceil((deadline-Date.now())/1000);
    if(remaining>0){ adminCountdownEl.textContent = `⏱ ${remaining} שניות עד ההזנקה`; }
    else{
      adminCountdownEl.textContent = "🏁 זינוק!";
      clearInterval(adminCountdownTimer); adminCountdownTimer=null;
      setTimeout(()=>{ adminCountdownEl.textContent=""; }, 2500);
    }
  }, 200);
}

/* ===================== signal polling + fullscreen countdown (runner only) ===================== */

function showCountdown(){ countdownOverlay.classList.add("show"); }
function hideCountdown(){ countdownOverlay.classList.remove("show"); if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; } }

async function pollSignal(){
  if(!myUser || myAdminScope || runState!=="idle") return;
  try{
    const res = await fetch(WORKER_URL+"/api/signal?plugah="+encodeURIComponent(myPlugah||""), {cache:"no-store"});
    const data = await res.json();
    const sig = data.signal;
    if(!sig) return;
    const deadline = sig.issuedAt + sig.seconds*1000;
    if(Date.now() >= deadline) return;
    if(sig.issuedAt === lastHandledSignalIssuedAt) return;
    lastHandledSignalIssuedAt = sig.issuedAt;
    runCountdown(deadline);
  }catch(e){}
}

function runCountdown(deadline){
  showCountdown();
  countdownLabel.textContent = "הזנקה — התכוננו!";
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(async ()=>{
    const remaining = Math.ceil((deadline - Date.now())/1000);
    if(remaining > 0){
      countdownNumber.textContent = remaining;
    }else{
      clearInterval(countdownTimer); countdownTimer=null;
      countdownNumber.textContent = "0";
      countdownLabel.textContent = "רוץ!";
      const result = await sendCheckIn();
      setTimeout(()=>{
        hideCountdown();
        if(!result || !result.near) setStatus("ההזנקה עברה — לא נרשמת (לא היית בטווח).","err");
      }, 900);
    }
  }, 100);
}

/* ===================== init ===================== */

initMap();
loadUsers();
</script>
