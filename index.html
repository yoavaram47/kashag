<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מיקומים חיים</title>
<style>
  :root{ --bg:#0b1220; --card:#121b2e; --line:#233150; --text:#eaf1ff; --muted:#8ea0c4; --accent:#35d0a0; --danger:#ff6b6b; --ok:#22c55e; }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:Calibri, Arial, sans-serif; transition:background .3s; }
  body.at-point{ background:#0d3b22; }
  header{ padding:20px 18px 4px; text-align:center; }
  h1{ margin:0; font-size:22px; }
  .wrap{ max-width:480px; margin:12px auto; padding:0 14px 30px; }
  select,button{ width:100%; padding:12px; border-radius:10px; font-size:15px; font-family:inherit; }
  select{ background:var(--card); border:1px solid var(--line); color:var(--text); margin-bottom:10px; }
  button{ background:var(--accent); border:0; color:#04231a; font-weight:700; cursor:pointer; }
  button:disabled{ opacity:.5; cursor:default; }
  body.at-point button{ background:var(--ok); color:#fff; }
  #status{ margin:12px 0; padding:10px 14px; border-radius:10px; background:var(--card); border:1px solid var(--line); font-size:14px; color:var(--muted); text-align:center; }
  #status.err{ color:var(--danger); border-color:var(--danger); }
  #status.ok{ color:#fff; background:var(--ok); border-color:var(--ok); font-weight:700; }
  .radar-box{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; }
  svg{ display:block; width:100%; height:auto; }
  .ring,.axis{ fill:none; stroke:var(--line); }
  .lbl{ fill:var(--muted); font-size:10px; text-anchor:middle; }
  ul{ list-style:none; margin:12px 0 0; padding:0; }
  li{ display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px; background:var(--card); border:1px solid var(--line); border-radius:10px; font-size:13px; }
  .sw{ width:12px; height:12px; border-radius:50%; }
  .nm{ flex:1; } .ds{ color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header><h1>📍 מיקומים חיים</h1><a href="results.html" style="color:var(--accent);font-size:14px">🏁 לתוצאות</a></header>
<div class="wrap">
  <select id="userSelect"><option value="">בחר משתמש…</option></select>
  <button id="sendBtn" disabled>שלח מיקום</button>
  <div id="status">בחרו משתמש ולחצו על "שלח מיקום"</div>
  <div class="radar-box"><svg id="radar" viewBox="0 0 260 260"></svg></div>
  <ul id="list"></ul>
</div>

<script>
const WORKER_URL = "https://kashag.yoav-aram-47.workers.dev";
const CHECKPOINTS = ["start", "middle"];

const $ = (id) => document.getElementById(id);
const userSelect = $('userSelect'), sendBtn = $('sendBtn'), statusEl = $('status'), svg = $('radar'), listEl = $('list');
let myUser = localStorage.getItem('liveloc_user') || '';
let myPos = null;

const rad = (d) => d * Math.PI / 180;
function distKm(a, b, c, d) {
  const x = Math.sin(rad(c - a) / 2) ** 2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(rad(d - b) / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(x));
}
const fmt = (km) => km < 1 ? Math.round(km * 1000) + " מ׳" : km.toFixed(km < 10 ? 1 : 0) + " ק״מ";
function colorFor(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} 70% 60%)`; }

function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ''; }

async function loadUsers() {
  try {
    const data = await (await fetch(WORKER_URL + '/api/users')).json();
    (data.users || []).forEach(u => userSelect.add(new Option(u, u)));
    if (myUser) { userSelect.value = myUser; sendBtn.disabled = !userSelect.value; }
  } catch { setStatus('שגיאה בטעינת רשימת המשתמשים מהשרת', 'err'); }
}

userSelect.addEventListener('change', () => {
  myUser = userSelect.value;
  localStorage.setItem('liveloc_user', myUser);
  sendBtn.disabled = !myUser;
  document.body.classList.remove('at-point');
});

sendBtn.addEventListener('click', () => {
  if (!navigator.geolocation) return setStatus('הדפדפן לא תומך במיקום.', 'err');
  sendBtn.disabled = true;
  setStatus('מאתר מיקום…');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    myPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    try {
      const res = await (await fetch(WORKER_URL + '/api/location', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: myUser, lat: myPos.lat, lon: myPos.lon })
      })).json();
      if (res.error) throw new Error(res.error);
      const near = res.near;
      document.body.classList.toggle('at-point', !!near);
      if (near) setStatus(`✅ אתה ב-${near.point} (${near.distance} מ׳) — נרשם ${near.timestamp}`, 'ok');
      else if (CHECKPOINTS.includes(myUser)) setStatus(`המיקום של ${myUser} עודכן.`);
      else setStatus('המיקום נשלח. אתה לא בטווח 20 מ׳ מ-start או middle.');
      const data = await (await fetch(WORKER_URL + '/api/locations')).json();
      render(data.locations || {});
    } catch (e) { setStatus('שגיאה בשליחה: ' + e.message, 'err'); }
    sendBtn.disabled = false;
  }, (err) => {
    setStatus(err.code === err.PERMISSION_DENIED ? 'לא ניתנה הרשאת מיקום.' : 'שגיאת מיקום: ' + err.message, 'err');
    sendBtn.disabled = false;
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
});

function render(locs) {
  const cx = 130, cy = 130, R = 110;
  let s = [0.33, 0.66, 1].map(f => `<circle class="ring" cx="${cx}" cy="${cy}" r="${R * f}"/>`).join('');
  s += `<line class="axis" x1="${cx - R}" y1="${cy}" x2="${cx + R}" y2="${cy}"/><line class="axis" x1="${cx}" y1="${cy - R}" x2="${cx}" y2="${cy + R}"/>`;
  s += `<text class="lbl" x="${cx}" y="${cy - R - 4}">צפון</text><text class="lbl" x="${cx}" y="${cy + R + 12}">דרום</text>`;
  s += `<text class="lbl" x="${cx + R + 14}" y="${cy + 3}">מזרח</text><text class="lbl" x="${cx - R - 14}" y="${cy + 3}">מערב</text>`;
  const others = Object.entries(locs).filter(([n]) => n !== myUser);
  const scale = Math.max(0.05, ...others.map(([, p]) => distKm(myPos.lat, myPos.lon, p.lat, p.lon))) * 1.15;
  s += `<circle cx="${cx}" cy="${cy}" r="7" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/><text class="lbl" x="${cx}" y="${cy + 20}">${myUser}</text>`;
  others.forEach(([n, p]) => {
    const dx = (p.lon - myPos.lon) * Math.cos(rad(myPos.lat)) * 111.32, dy = (p.lat - myPos.lat) * 111.32;
    s += `<circle cx="${cx + dx / scale * R}" cy="${cy - dy / scale * R}" r="6" fill="${colorFor(n)}" stroke="var(--bg)" stroke-width="2"/>`;
  });
  svg.innerHTML = s;
  listEl.innerHTML = '';
  others.map(([n, p]) => [n, distKm(myPos.lat, myPos.lon, p.lat, p.lon)]).sort((a, b) => a[1] - b[1]).forEach(([n, d]) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="sw" style="background:${colorFor(n)}"></span><span class="nm"></span><span class="ds">${fmt(d)}</span>`;
    li.querySelector('.nm').textContent = n;
    listEl.appendChild(li);
  });
}

loadUsers();
</script>
</body>
</html>
