<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תוצאות</title>
<style>
  :root{ --bg:#0b1220; --card:#121b2e; --line:#233150; --text:#eaf1ff; --muted:#8ea0c4; --accent:#35d0a0; }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:Calibri, Arial, sans-serif; }
  header{ padding:20px 18px 4px; text-align:center; }
  h1{ margin:0; font-size:22px; }
  .wrap{ max-width:520px; margin:12px auto; padding:0 14px 30px; }
  .bar{ display:flex; gap:10px; margin-bottom:12px; }
  .bar a{ flex:1; padding:12px; border-radius:10px; font-size:15px; text-align:center; text-decoration:none; background:var(--card); border:1px solid var(--line); color:var(--text); }
  #searchInput{ width:100%; padding:12px; border-radius:10px; font-size:15px; font-family:inherit; background:var(--card); border:1px solid var(--line); color:var(--text); margin-bottom:12px; }
  #searchInput::placeholder{ color:var(--muted); }
  .user{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .top{ display:flex; justify-content:space-between; align-items:baseline; }
  .name{ font-size:16px; font-weight:700; }
  .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .best{ color:var(--accent); font-weight:700; font-size:18px; }
  .run,.note{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding-top:6px; }
  .run b{ color:var(--text); }
  #msg{ text-align:center; color:var(--muted); padding:16px; }
</style>
</head>
<body>
<header><h1>🏁 תוצאות</h1></header>
<div class="wrap">
  <div class="bar"><a href="index.html">חזרה למיקומים</a></div>
  <input id="searchInput" placeholder="הקלידו שם לחיפוש…" autocomplete="off" list="namesList">
  <datalist id="namesList"></datalist>
  <div id="msg">הקלידו שם כדי לראות תוצאות.</div>
  <div id="out"></div>
</div>
<script>
const WORKER_URL = "https://kashag.yoav-aram-47.workers.dev";
const fmtDur = (s) => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("he-IL");
const STATE = { started: "התחיל ריצה — עדיין לא הגיע ל-Middle", middle: "הגיע ל-Middle — עדיין לא חזר ל-Start" };

let allRows = [];

function renderCard(r){
  const d = document.createElement("div"); d.className = "user";
  const top = document.createElement("div"); top.className = "top";
  const nameWrap = document.createElement("div");
  const n = document.createElement("div"); n.className = "name"; n.textContent = r.name;
  nameWrap.append(n);
  if(r.meta){
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = `פלוגה ${r.meta.plugah || "—"} · צוות ${r.meta.tzevet || "—"}`;
    nameWrap.append(m);
  }
  const b = document.createElement("span"); b.className = "best"; b.textContent = r.best == null ? "—" : fmtDur(r.best);
  top.append(nameWrap, b); d.append(top);
  r.runs.forEach((x, i) => {
    const row = document.createElement("div"); row.className = "run";
    row.innerHTML = `<span>ריצה ${i + 1}: ${fmtTime(x.start)} ← ${fmtTime(x.middle)} ← ${fmtTime(x.end)}</span><b>${fmtDur(x.seconds)}</b>`;
    d.append(row);
  });
  if (STATE[r.state]) { const s = document.createElement("div"); s.className = "note"; s.textContent = STATE[r.state]; d.append(s); }
  if (!r.runs.length && !STATE[r.state]) { const s = document.createElement("div"); s.className = "note"; s.textContent = "אין ריצה שלמה עדיין"; d.append(s); }
  return d;
}

function renderResults(query){
  const msg = document.getElementById("msg"), out = document.getElementById("out");
  out.innerHTML = "";
  const q = query.trim();
  if (!q) { msg.textContent = "הקלידו שם כדי לראות תוצאות."; return; }
  const matches = allRows.filter(r => r.name.includes(q));
  if (!matches.length) { msg.textContent = `לא נמצאה תוצאה בשם "${q}".`; return; }
  msg.textContent = "";
  matches.sort((a, b) => (a.best ?? Infinity) - (b.best ?? Infinity));
  matches.forEach(r => out.append(renderCard(r)));
}

async function load(){
  const msg = document.getElementById("msg");
  try {
    const { results } = await (await fetch(WORKER_URL + "/api/results")).json();
    allRows = Object.entries(results).map(([id, r]) => ({
      id, name: r.name || id, ...r, best: r.runs.length ? Math.min(...r.runs.map(x => x.seconds)) : null
    }));
    const namesList = document.getElementById("namesList");
    allRows.forEach(r => namesList.add(new Option(r.name, r.name)));
    renderResults(document.getElementById("searchInput").value);
  } catch (e) {
    msg.textContent = "שגיאה בטעינת התוצאות: " + e.message;
  }
}

document.getElementById("searchInput").addEventListener("input", (e) => renderResults(e.target.value));
load();
</script>
</body>
</html>
